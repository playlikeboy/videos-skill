<script>
const C = { bg: '#0d0a17', ink: '#ffffff', muted: '#a59bbd', card: '#1a1429', line: '#2e2547', brand: '#9d6cff', light: '#d19eff', deep: '#6b3df5' };
const BPM = 96, DUR = 16.25, CUTS = [2.5, 6.25, 10, 12.5];
const logo = document.getElementById('logo');

// Both posts are written for this reel. They are fictional and labelled as samples on screen.
const POSTS = [
  { text: "I've nodded through 3 semesters of pointers. I still don't get pointers.", count: 214 },
  { text: "To whoever saves me a seat in the 8 am lecture: you're the reason I show up.", count: 389 },
];

function backdrop(t) {
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
  [[240 + Math.sin(t * .5) * 90, 520 + Math.cos(t * .4) * 70, 760, 'rgba(107,61,245,.34)'], [860 + Math.cos(t * .45) * 80, 1340 + Math.sin(t * .35) * 90, 820, 'rgba(209,158,255,.16)']].forEach(([x, y, r, c]) => {
    const g = ctx.createRadialGradient(x, y, 20, x, y, r); g.addColorStop(0, c); g.addColorStop(1, 'rgba(13,10,23,0)');
    setA(1); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  });
}

function tag(label, y, p) {
  if (p <= 0) return; const w = measure(label, 32, 'Inter', 700) + 26 * 4 + 72, e = E.out(p);
  rr(W / 2 - w / 2, y - 44, w, 72, 36, 'rgba(157,108,255,.14)', C.brand, 3, e);
  txt(label, W / 2 + 2, y + 4, { px: 32, wt: 700, fill: C.light, ls: 4, alpha: e });
}

function card(post, lt, yTop) { // lt: seconds since the card arrived
  const x = 80, w = W - 160, pad = 56, px = 60, lh = 84, lines = wrap(post.text, w - pad * 2, px, 'Inter', 700);
  const h = pad + 96 + 40 + lines.length * lh + 36 + 92 + pad;
  rr(x, yTop, w, h, 44, C.card, C.line, 3);
  const g = ctx.createLinearGradient(x + pad, yTop + pad, x + pad + 96, yTop + pad + 96); g.addColorStop(0, C.light); g.addColorStop(1, C.deep);
  ctx.beginPath(); ctx.arc(x + pad + 48, yTop + pad + 48, 48, 0, 7); ctx.fillStyle = g; setA(1); ctx.fill();
  txt('?', x + pad + 48, yTop + pad + 68, { px: 56, wt: 900, fill: '#fff' });
  txt('Anonymous', x + pad + 122, yTop + pad + 64, { px: 46, wt: 700, fill: C.ink, align: 'left' });
  const sw = 232; rr(x + w - pad - sw, yTop + pad + 16, sw, 62, 31, null, C.line, 3);
  txt('sample post', x + w - pad - sw / 2, yTop + pad + 58, { px: 30, wt: 500, fill: C.muted });
  // typed body: wrapping is fixed up front so lines never reflow
  const total = post.text.length, shown = Math.floor(total * prog(lt, .35, 1.9)); let used = 0;
  lines.forEach((ln, i) => {
    const n = clamp(shown - used, 0, ln.length); used += ln.length + 1;
    if (n > 0) txt(ln.slice(0, n), x + pad, yTop + pad + 96 + 40 + (i + 1) * lh - 22, { px, wt: 700, fill: C.ink, align: 'left' });
    if (n > 0 && n < ln.length && Math.floor(lt * 4) % 2 === 0) { ctx.fillStyle = C.brand; setA(1); ctx.fillRect(x + pad + measure(ln.slice(0, n), px, 'Inter', 700) + 6, yTop + pad + 96 + 40 + i * lh + 12, 6, 60); }
  });
  const fy = yTop + h - pad - 92, rp = prog(lt, 2.45, .3);
  if (rp > 0) {
    const n = Math.round(post.count * E.out(prog(lt, 2.5, .7))), label = `same here  ${n}`, bw = measure(label, 38, 'Inter', 700) + 84, e = E.back(rp);
    rr(x + pad, fy + (1 - e) * 20, bw, 84, 42, 'rgba(157,108,255,.18)', C.brand, 3, clamp(e));
    txt(label, x + pad + 42, fy + 56 + (1 - e) * 20, { px: 38, wt: 700, fill: C.light, align: 'left', alpha: clamp(e) });
  }
  return h;
}

function draw(t) {
  backdrop(t);

  // 1: hook
  scene(t, 0, 2.5, lt => {
    tag('ON YOUR CAMPUS', 560, prog(lt, .05, .3));
    [['Confessions', C.ink, .15], ['nobody', C.ink, .6], ['signs.', C.light, 1.05]].forEach(([w, col, at], i) => {
      const p = prog(lt, at, .32); if (p <= 0) return; const s = E.back(p);
      txt(w, W / 2, 800 + i * 150, { px: 134 * s, wt: 900, fill: col, alpha: clamp(p * 2) });
    });
  });

  // 2 + 3: two sample confessions
  POSTS.forEach((post, i) => {
    const a = CUTS[i], b = CUTS[i + 1];
    scene(t, a, b, lt => {
      tag(i === 0 ? 'POSTED TODAY' : 'ALSO TODAY', 560, prog(lt, .05, .3));
      const enter = E.out(prog(lt, .05, .45)), leave = E.in(prog(lt, b - a - .3, .3));
      card(post, lt, 680 + (1 - enter) * 160 - leave * 120);
    });
  });

  // 4: the promise
  scene(t, 10, 12.5, lt => {
    rise('Your name', W / 2, 690, prog(lt, .05, .35), { px: 130, wt: 900, fill: C.ink });
    rise('never shows.', W / 2, 840, prog(lt, .2, .35), { px: 130, wt: 900, fill: C.light });
    const p = prog(lt, .45, .35); if (p > 0) {
      const e = E.out(p), y = 1010 + (1 - e) * 40; rr(140, y, W - 280, 150, 40, C.card, C.line, 3, e);
      txt('posted by', 196, y + 94, { px: 46, wt: 500, fill: C.muted, align: 'left', alpha: e });
      const nx = 196 + measure('posted by', 46, 'Inter', 500) + 28, wipe = E.inOut(prog(lt, .9, .5)), nw = measure('Anonymous', 46, 'Inter', 700) + 12;
      txt('your name', nx, y + 94, { px: 46, wt: 700, fill: C.ink, align: 'left', alpha: e * (1 - prog(lt, 1.35, .1)) });
      if (wipe > 0) rr(nx - 10, y + 46, (nw + 20) * wipe, 64, 14, C.brand);
      txt('Anonymous', nx + 6, y + 94, { px: 46, wt: 700, fill: '#fff', align: 'left', alpha: prog(lt, 1.4, .2) });
    }
    rise('Not even to staff.', W / 2, 1310, prog(lt, 1.5, .35), { px: 66, wt: 700, fill: C.ink });
  });

  // 5: end card
  scene(t, 12.5, DUR + .01, lt => {
    const p = E.back(prog(lt, .05, .5)), s = 460 * p;
    if (p > 0 && logo.complete) { setA(prog(lt, .05, .3)); ctx.drawImage(logo, W / 2 - s / 2, 560 - s / 2, s, s); }
    rise('CampusLoop', W / 2, 900, prog(lt, .3, .35), { px: 128, wt: 900, fill: C.ink });
    rise('Your campus.', W / 2, 1010, prog(lt, .55, .35), { px: 58, wt: 500, fill: C.muted });
    rise('Only your campus.', W / 2, 1086, prog(lt, .7, .35), { px: 58, wt: 700, fill: C.ink });
    const b = E.back(prog(lt, 1.0, .45)); if (b > 0) {
      const bw = 780 * b, bh = 128 * b * (1 + .02 * Math.sin(lt * 5)), g = ctx.createLinearGradient(W / 2 - bw / 2, 0, W / 2 + bw / 2, 0);
      g.addColorStop(0, C.deep); g.addColorStop(1, C.brand); rr(W / 2 - bw / 2, 1250 - bh / 2, bw, bh, bh / 2, g);
      txt('Join with college email', W / 2, 1250 + 18 * b, { px: 52 * b, wt: 700, fill: '#fff' });
    }
    rise('campusloop.space  ·  link in bio', W / 2, 1420, prog(lt, 1.3, .35), { px: 42, wt: 500, fill: C.muted });
  }, .25, .01);
}

window.CUES = CUTS;
window.SCORE = ac => buildScore(ac, { bpm: BPM, dur: DUR, root: 48, chords: [0, 5, 9, 7], minor: false, kickFrom: 2.5, level: .9, hits: CUTS });
startReel(Math.round(DUR * FPS), draw);
</script>
