const C = { bg: '#000000', ink: '#f8fbfe', gray: '#939ca9', dim: '#232a34', card: '#11151b', line: '#2a313c', lime: '#ccff00', blue: '#4f91f2' };
const DUR = 16, BPM = 120, CUTS = [3, 6, 9.5, 12.5];
const D = 'Familjen Grotesk', M = 'JetBrains Mono';
const logo = document.getElementById('logo');

// 40 page tiles: 8 columns x 5 rows. Three of them end up indexed.
const COLS = 8, ROWS = 5, CELL = 100, GAP = 16, GX = (W - (COLS * CELL + (COLS - 1) * GAP)) / 2, GY = 900;
const SEEN = [5, 19, 30];

function backdrop(t) {
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#ffffff'; setA(.05);
  for (let y = 60; y < H; y += 60) for (let x = 30; x < W; x += 60) ctx.fillRect(x, y, 3, 3);
  const g = ctx.createRadialGradient(W / 2, 760 + Math.sin(t * .7) * 30, 60, W / 2, 760, 900);
  g.addColorStop(0, 'rgba(204,255,0,.07)'); g.addColorStop(1, 'rgba(204,255,0,0)');
  setA(1); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}

function grid(t) { // t is film time, 0..6
  for (let i = 0; i < 40; i++) {
    const pop = prog(t, .3 + i * (1.5 / 40), .22); if (pop <= 0) continue;
    const col = i % COLS, row = Math.floor(i / COLS), s = E.back(pop);
    const cx = GX + col * (CELL + GAP) + CELL / 2, cy = GY + row * (CELL + GAP) + CELL / 2;
    const flip = E.inOut(prog(t, 3.1 + (col + row) * .045, .35)), seen = SEEN.includes(i);
    const size = CELL * s * (seen ? 1 + .1 * Math.sin(Math.max(0, t - 3.6) * 6) * flip : 1);
    if (seen) { rr(cx - size / 2, cy - size / 2, size, size, 14, C.ink, null, 0, 1 - flip); rr(cx - size / 2, cy - size / 2, size, size, 14, C.lime, null, 0, flip); }
    else { rr(cx - size / 2, cy - size / 2, size, size, 14, C.ink, null, 0, 1 - flip * .97); rr(cx - size / 2, cy - size / 2, size, size, 14, null, C.dim, 3, flip); }
  }
}

function draw(t) {
  backdrop(t);

  // 1 + 2: you shipped 40, engines saw 3
  scene(t, 0, 6, lt => {
    const swap = prog(lt, 3, .3);
    rise('You shipped', W / 2, 400, prog(lt, .05, .35), { px: 84, fam: D, fill: C.ink, alpha: 1 - swap });
    rise('Search engines saw', W / 2, 400, prog(lt, 3.1, .35), { px: 84, fam: D, fill: C.ink });
    const up = Math.round(40 * prog(lt, .3, 1.5)), down = Math.round(lerp(40, 3, E.inOut(prog(lt, 3.2, .9))));
    const n = lt < 3.2 ? up : down, hit = lt < 3 ? prog(lt, 1.8, .25) : prog(lt, 4.1, .25);
    const px = 330 * (1 + .08 * Math.sin(hit * Math.PI));
    txt(String(n), W / 2, 690, { px, fam: D, fill: lt >= 4.1 ? C.lime : C.ink, alpha: prog(lt, .2, .2) });
    rise('pages this week.', W / 2, 800, prog(lt, 1.7, .35), { px: 62, wt: 500, fill: C.gray, alpha: 1 - swap });
    rise('of them.', W / 2, 800, prog(lt, 4.2, .35), { px: 62, wt: 500, fill: C.gray });
    grid(lt);
  });

  // 3: the sitemap card
  scene(t, 6, 9.5, lt => {
    rise('IndexFast watches', W / 2, 370, prog(lt, .1, .35), { px: 96, fam: D, fill: C.ink });
    rise('your sitemap.', W / 2, 480, prog(lt, .25, .35), { px: 96, fam: D, fill: C.lime });
    const cy = 620 + (1 - E.out(prog(lt, .2, .45))) * 80, cx = 84, cw = W - 168, ch = 720;
    rr(cx, cy, cw, ch, 36, C.card, C.line, 3);
    ctx.fillStyle = C.lime; setA(1); ctx.beginPath(); ctx.arc(cx + 60, cy + 62, 12, 0, 7); ctx.fill();
    txt('sitemap.xml', cx + 92, cy + 78, { px: 44, fam: M, fill: C.gray, align: 'left' });
    ctx.fillStyle = C.line; setA(1); ctx.fillRect(cx, cy + 124, cw, 3);
    const rows = ['/blog/launch-notes', '/pricing', '/docs/quickstart', '/changelog/v2'];
    rows.forEach((path, i) => {
      const a = prog(lt, .5 + i * .2, .3), done = prog(lt, 1.4 + i * .42, .3), ry = cy + 124 + 74 + i * 142;
      if (a <= 0) return;
      txt(path, cx + 48, ry + 16, { px: 42, fam: M, fill: C.ink, align: 'left', alpha: E.out(a) });
      const pw = done > 0 ? 306 : 124, px0 = cx + cw - 48 - pw;
      if (done > 0) { rr(px0, ry - 34, pw, 68, 34, C.lime, null, 0, E.out(done)); txt('submitted', px0 + 30, ry + 13, { px: 36, wt: 700, fill: '#0a0d00', align: 'left', alpha: E.out(done) }); check(px0 + pw - 50, ry, 28, done, '#0a0d00', 6); }
      else { rr(px0, ry - 34, pw, 68, 34, null, C.blue, 3, E.out(a)); txt('new', px0 + pw / 2, ry + 13, { px: 36, wt: 700, fill: C.blue, alpha: E.out(a) }); }
    });
    const scan = prog(lt, .5, 1); if (scan > 0 && scan < 1) { ctx.fillStyle = C.lime; setA(.5 * Math.sin(scan * Math.PI)); ctx.fillRect(cx + 20, cy + 140 + scan * (ch - 170), cw - 40, 4); }
    rise('New or updated page? Submitted for you.', W / 2, 1440, prog(lt, 2.2, .35), { px: 44, wt: 500, fill: C.gray });
  });

  // 4: the engines
  scene(t, 9.5, 12.5, lt => {
    rise('Sent to IndexNow', W / 2, 370, prog(lt, .1, .35), { px: 96, fam: D, fill: C.ink });
    rise('search engines.', W / 2, 480, prog(lt, .25, .35), { px: 96, fam: D, fill: C.lime });
    ['Bing', 'Yandex', 'Naver', 'Seznam', 'Yep'].forEach((name, i) => {
      const a = prog(lt, .3 + i * .1, .3), ok = prog(lt, .75 + i * .32, .3), y = 600 + i * 150 + (1 - E.out(a)) * 50;
      if (a <= 0) return;
      rr(84, y, W - 168, 122, 30, C.card, ok > 0 ? C.lime : C.line, 3, E.out(a));
      txt(name, 136, y + 82, { px: 62, fam: D, fill: C.ink, align: 'left', alpha: E.out(a) });
      ctx.beginPath(); ctx.arc(W - 150, y + 61, 34, 0, 7); setA(E.out(a));
      if (ok > 0) { ctx.fillStyle = C.lime; ctx.fill(); check(W - 150, y + 61, 32, ok, '#0a0d00', 7); } else { ctx.strokeStyle = C.line; ctx.lineWidth = 3; ctx.stroke(); }
    });
    rise('Google: sitemap resubmitted', W / 2, 1410, prog(lt, 2.0, .35), { px: 40, wt: 500, fill: C.gray });
    rise('through Search Console.', W / 2, 1464, prog(lt, 2.1, .35), { px: 40, wt: 500, fill: C.gray });
  });

  // 5: end card
  scene(t, 12.5, 16.01, lt => {
    const p = E.back(prog(lt, .05, .5)), lw = 540 * p, lh = lw * (520 / 760);
    if (p > 0 && logo.complete) { ctx.globalCompositeOperation = 'lighten'; setA(prog(lt, .05, .3)); ctx.drawImage(logo, W / 2 - lw / 2 - 12 * p, 590 - lh / 2, lw, lh); ctx.globalCompositeOperation = 'source-over'; }
    rise('IndexFast', W / 2, 950, prog(lt, .3, .35), { px: 132, fam: D, fill: C.ink });
    rise('You ship pages.', W / 2, 1060, prog(lt, .55, .35), { px: 56, wt: 500, fill: C.gray });
    rise('We get them found.', W / 2, 1134, prog(lt, .7, .35), { px: 56, wt: 700, fill: C.ink });
    const b = E.back(prog(lt, 1.0, .45)); if (b > 0) {
      const bw = 660 * b, bh = 124 * b * (1 + .02 * Math.sin(lt * 5));
      rr(W / 2 - bw / 2, 1290 - bh / 2, bw, bh, bh / 2, C.lime);
      txt('Add your site free', W / 2, 1290 + 18 * b, { px: 52 * b, wt: 700, fill: '#0a0d00' });
    }
    rise('indexfast.co  ·  link in bio', W / 2, 1450, prog(lt, 1.3, .35), { px: 42, wt: 500, fill: C.gray });
  }, .25, .01);
}

window.CUES = CUTS;
window.SCORE = ac => buildScore(ac, { bpm: BPM, dur: DUR, root: 45, chords: [0, 0, 3, 5], minor: true, hits: CUTS });
startReel(DUR * FPS, draw);
</script>
